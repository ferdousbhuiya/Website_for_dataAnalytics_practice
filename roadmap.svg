<svg width="800" height="120" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="url(#grad1)" />
        </marker>
    </defs>
    <style>
        .node { fill: #f7fafc; stroke: #e2e8f0; stroke-width: 2; }
        .node-text { font-family: 'Inter', sans-serif; font-size: 14px; fill: #2d3748; font-weight: 600; }
        .connector { stroke: url(#grad1); stroke-width: 2; marker-end: url(#arrow); }
    </style>

    <!-- Nodes -->
    <rect class="node" x="10" y="40" width="120" height="40" rx="8"></rect>
    <text class="node-text" x="70" y="65" text-anchor="middle">Python Setup</text>

    <rect class="node" x="170" y="40" width="120" height="40" rx="8"></rect>
    <text class="node-text" x="230" y="65" text-anchor="middle">Pandas</text>

    <rect class="node" x="330" y="40" width="120" height="40" rx="8"></rect>
    <text class="node-text" x="390" y="65" text-anchor="middle">SQL</text>

    <rect class="node" x="490" y="40" width="120" height="40" rx="8"></rect>
    <text class="node-text" x="550" y="65" text-anchor="middle">Statistics</text>

    <rect class="node" x="650" y="40" width="120" height="40" rx="8"></rect>
    <text class="node-text" x="710" y="65" text-anchor="middle">ML Models</text>

    <!-- Connectors -->
    <path class="connector" d="M 130 60 H 160" />
    <path class="connector" d="M 290 60 H 320" />
    <path class="connector" d="M 450 60 H 480" />
    <path class="connector" d="M 610 60 H 640" />
</svg>
