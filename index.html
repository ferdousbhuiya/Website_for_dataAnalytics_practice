<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06111c">
  <title>DataPrep Pro | Learn Data Analytics from Beginner to Advanced</title>
  <meta name="description" content="Learn data analytics from beginner to advanced with structured lessons, hands-on practice, projects, interview preparation, statistics tools, and progress tracking.">
  <link rel="canonical" href="https://datapath.ferdous.us/">
  <style>
    html,body{margin:0;min-height:100%;background:#06111c;color:#edf5fb;font-family:Arial,sans-serif}
    .root-loader{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .root-loader div{max-width:520px}
    .root-loader strong{display:block;font-size:22px;margin-bottom:10px}
    .root-loader span{opacity:.72}
  </style>
</head>
<body>
  <div class="root-loader"><div><strong>Loading DataPrep Pro…</strong><span>Preparing your learning workspace.</span></div></div>
  <script>
    (function(){
      var appUrl='/preview/index.html?v=60';
      function hasAuthPayload(){
        var q=new URLSearchParams(location.search);
        return q.has('code')||q.has('token_hash')||q.has('type')||q.has('error')||/access_token=|refresh_token=|error=|type=/.test(location.hash||'');
      }
      fetch(appUrl,{cache:'no-store'})
        .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
        .then(function(html){
          html=html.replace(/<head(\s[^>]*)?>/i,function(m){return m+'<base href="/preview/">';});
          document.open();
          document.write(html);
          document.close();
          if(!hasAuthPayload()&&(location.pathname!=='/'||location.search)){
            history.replaceState(null,'','/'+location.hash);
          }
        })
        .catch(function(){
          document.body.innerHTML='<div class="root-loader"><div><strong>DataPrep Pro could not load.</strong><span>Please refresh the page in a moment.</span></div></div>';
        });
    })();
  </script>
  <noscript><div class="root-loader"><div><strong>JavaScript is required.</strong><span>Please enable JavaScript to use DataPrep Pro.</span></div></div></noscript>
</body>
</html>
